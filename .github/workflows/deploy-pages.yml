name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://rizleneberrag.github.io/portfolio_Ines
      ASSET_URL: https://rizleneberrag.github.io/portfolio_Ines
      LOG_CHANNEL: stderr
      CACHE_STORE: file
      SESSION_DRIVER: file

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Install front-end dependencies
        run: npm ci

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear
          php artisan view:clear

      - name: Build front-end assets
        run: npm run build

      - name: Export the homepage as a static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/portfolio-laravel.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8000 > _site/index.html; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              cat /tmp/portfolio-laravel.log
              exit 1
            fi

            sleep 1
          done

          cp -R public/build _site/build
          cp -R public/images _site/images

          find public -maxdepth 1 -type f \
            ! -name 'index.php' \
            ! -name 'hot' \
            ! -name '.htaccess' \
            -exec cp '{}' _site/ \;

          touch _site/.nojekyll

          python3 <<'PY'
          from pathlib import Path

          page = Path('_site/index.html')
          html = page.read_text(encoding='utf-8')
          base = '/portfolio_Ines'

          replacements = {
              'href="/build/': f'href="{base}/build/',
              "href='/build/": f"href='{base}/build/",
              'src="/build/': f'src="{base}/build/',
              "src='/build/": f"src='{base}/build/",
              'src="/images/': f'src="{base}/images/',
              "src='/images/": f"src='{base}/images/",
              'data-image-src="/images/': f'data-image-src="{base}/images/',
              "data-image-src='/images/": f"data-image-src='{base}/images/",
              'href="/favicon': f'href="{base}/favicon',
              "href='/favicon": f"href='{base}/favicon",
          }

          for source, target in replacements.items():
              html = html.replace(source, target)

          page.write_text(html, encoding='utf-8')
          PY

          if grep -R "127.0.0.1\|localhost:5173" _site/index.html; then
            echo "A local development URL is still present in the exported page."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
